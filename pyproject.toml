[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apolaki"
version = "0.1.0"
description = "Prosocial marketing engine with built-in ethics guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "CC (Coalition Code)" },
    { name = "Thomas Edrington" },
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
